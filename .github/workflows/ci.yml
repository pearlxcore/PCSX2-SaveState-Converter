name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build SaveStateConverter.slnx -c Release
      # Tests that need the native converter and real save states (SAVECONVERT_NATIVE,
      # SAVECONVERT_TEST_FIXTURE) skip themselves here.
      - name: Test
        run: dotnet test SaveStateConverter.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  patches:
    name: Patches apply to PCSX2 v2.8.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check patches
        run: bash tools/check_patches.sh
